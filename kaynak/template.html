<title>Ankara Filo Konsolu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console. Header with views, region rail, then map (or view) beside a persistent detail/alerts panel. */
:root {
  --bg: #e9edec;
  --panel: #ffffff;
  --panel-2: #f4f6f5;
  --ink: #13202a;
  --muted: #5a6871;
  --line: #d6dddd;
  --accent: #0e6b70;
  --accent-soft: #d5ebea;
  --accent-ink: #ffffff;
  --mark: #f2b705;
  --land: #eceeec;
  --road: #ffffff;
  --road-case: #d3d8d7;
  --park: #d6e8d2;
  --water: #c9dfea;
  --rail: #aab4b7;
  --border: #9aa7aa;
  --label: #6a777d;
  --route: #6f7f86;
  --r1: #dfe9f6; --r2: #e5f1e3; --r3: #f6ecdc; --r4: #efe3f1; --r5: #e2eff0;
  --ok: #1f9d55;
  --est: #e07b00;
  --off: #8b969d;
  --crit: #d3352b;
  --warn: #c98a00;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1418; --panel: #151f25; --panel-2: #1b262d; --ink: #e5ecee; --muted: #93a2aa; --line: #26343c;
    --accent: #45b5ba; --accent-soft: #173a3d; --accent-ink: #06191a; --mark: #f2b705; --land: #10171b; --road: #2a363c; --road-case: #0a0f12; --park: #142519; --water: #10242d; --rail: #3d4a50; --border: #4a5a61; --label: #8a99a2; --route: #9aabb2;
    --r1: #172433; --r2: #172a1d; --r3: #2c2416; --r4: #2a1c2d; --r5: #142a2c;
    --ok: #39c477; --est: #f2932c; --off: #7c888f; --crit: #f0584e; --warn: #e3a93a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1418; --panel: #151f25; --panel-2: #1b262d; --ink: #e5ecee; --muted: #93a2aa; --line: #26343c;
  --accent: #45b5ba; --accent-soft: #173a3d; --accent-ink: #06191a; --mark: #f2b705; --land: #10171b; --road: #2a363c; --road-case: #0a0f12; --park: #142519; --water: #10242d; --rail: #3d4a50; --border: #4a5a61; --label: #8a99a2; --route: #9aabb2;
  --r1: #172433; --r2: #172a1d; --r3: #2c2416; --r4: #2a1c2d; --r5: #142a2c;
  --ok: #39c477; --est: #f2932c; --off: #7c888f; --crit: #f0584e; --warn: #e3a93a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; }

/* Header */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.demo { font-family: var(--mono); font-size: 11px; color: var(--warn); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; overflow-x: auto; max-width: 100%; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; white-space: nowrap; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .badge { font-family: var(--mono); font-size: 11px; background: var(--crit); color: #fff; border-radius: 8px; padding: 0 6px; }
.spacer { flex: 1; }
.search { position: relative; min-width: 0; flex: 0 1 300px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px 7px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; }
.search .hits { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.35); overflow: hidden; }
.search .hits button { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-top: 1px solid var(--line); }
.search .hits button:first-child { border-top: 0; }
.search .hits button:hover, .search .hits button:focus-visible { background: var(--panel-2); }
.clock { font-family: var(--mono); color: var(--muted); font-size: 13px; }

/* Region rail */
.rail { display: flex; gap: 10px; align-items: stretch; overflow-x: auto; padding-bottom: 2px; }
.region { flex: 0 0 auto; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; min-width: 132px; position: relative; }
.region .rn { font-family: var(--display); font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.region .sw { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); }
.region .rs { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
.region .rp { font-size: 11.5px; color: var(--muted); }
.region .rs .c { color: var(--crit); font-weight: 600; }
.region[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.kpis { margin-left: auto; display: flex; gap: 18px; align-items: center; padding: 0 6px; flex: 0 0 auto; }
.kpi { display: grid; }
.kpi b { font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 5px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }

/* Main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; min-height: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; min-height: 0; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.mapwrap { position: relative; overflow: hidden; min-height: 320px; }
#map { width: 100%; height: 100%; display: block; background: var(--land); touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
#gmap { position: absolute; inset: 0; z-index: 0; }
.lines, .legend, .maptools, .attr { z-index: 2; }
.lines { position: absolute; left: 10px; top: 10px; width: min(340px, calc(100% - 64px)); max-height: calc(100% - 74px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px -16px rgba(0,0,0,.45); overflow: hidden; }
.lines-h { padding: 12px 14px 10px; display: grid; gap: 3px; border-bottom: 1px solid var(--line); }
.lines-h b { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.1; }
.lines-h span { color: var(--muted); font-size: 12.5px; }
.lines-h .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.lines-h .chips button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.lines-h .chips button[aria-pressed="true"] { background: var(--mark); border-color: var(--mark); color: #1d1600; font-weight: 600; }
.lines-h .clear { justify-self: start; border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; font-size: 12.5px; margin-top: 2px; }
.lines-cols { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 10px; padding: 6px 14px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
.lines-list { overflow-y: auto; min-height: 0; }
.lrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 44px; gap: 2px 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); padding: 9px 14px; align-items: center; }
.lrow:hover { background: var(--panel-2); }
.lrow[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--mark); }
.lrow .code { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.lrow .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .cnt { font-family: var(--display); font-size: 20px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.lrow .sub { grid-column: 2 / 4; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
.lrow .dbar { flex: 1; height: 5px; border-radius: 3px; background: var(--panel-2); display: flex; overflow: hidden; max-width: 90px; }
.lrow .dbar i { display: block; height: 100%; }
.lrow .warn { color: var(--est); font-weight: 600; }
.ltabs { display: flex; gap: 4px; margin-top: 8px; }
.ltabs button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 8px; font-size: 13px; font-weight: 500; }
.ltabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); } .lrow .bad { color: var(--crit); font-weight: 600; }
@media (max-width: 860px) { .lines { max-height: 46%; } }
.gml { text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel), 0 0 2px var(--panel); white-space: nowrap; }
.maptools { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.maptools button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; font-size: 16px; font-weight: 600; }

.mapbar { position: absolute; left: 10px; top: 10px; right: 56px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
.mapbar > * { pointer-events: auto; }
.where { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 1px; box-shadow: 0 6px 18px -12px rgba(0,0,0,.4); }
.where b { font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.1; }
.where span { font-size: 12.5px; color: var(--muted); }
.wbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 500; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 18px -12px rgba(0,0,0,.4); }
.wbtn i { width: 14px; height: 4px; border-radius: 2px; background: var(--mark); }
.wpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; width: min(340px, 80vw); max-height: 340px; overflow-y: auto; box-shadow: 0 16px 40px -16px rgba(0,0,0,.45); }
.wpop label { display: grid; grid-template-columns: 18px 64px 1fr; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.wpop label:hover { background: var(--panel-2); }
.wpop h5 { margin: 8px 8px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.wpop label.g { grid-template-columns: 18px 1fr auto; }
.wpop label.g small { display: block; color: var(--muted); font-size: 11.5px; }
.wpop label.g em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--ink); }
.wpop label span:last-child { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wwrap { position: relative; }
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: flex; gap: 2px; flex-wrap: wrap; max-width: calc(100% - 20px); box-shadow: 0 6px 18px -12px rgba(0,0,0,.4); }
.legend button { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--ink); }
.legend button[aria-pressed="false"] { color: var(--muted); }
.legend button[aria-pressed="false"] .dot { opacity: .3; }
.legend button:hover { background: var(--panel-2); }
.legend b { font-variant-numeric: tabular-nums; font-weight: 600; }
.legend .static { padding: 5px 9px; display: flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); }


/* Map marks */
#map { --z: 1; }
.b-water { fill: var(--water); stroke: none; }
.b-park { fill: var(--park); stroke: none; }
.b-case, .b-road, .b-sec, .b-rail, .b-sub, .b-dist { fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.b-sec { stroke: var(--road); stroke-width: calc(1px * var(--z)); }
.b-case { stroke: var(--road-case); stroke-width: calc(3.4px * var(--z)); }
.b-road { stroke: var(--road); stroke-width: calc(2px * var(--z)); }
.b-case.m { stroke-width: calc(4.6px * var(--z)); } .b-road.m { stroke-width: calc(3px * var(--z)); }
.b-rail { stroke: var(--rail); stroke-width: 1.2px; stroke-dasharray: 5 3; }
.b-sub { stroke: var(--rail); stroke-width: 1.6px; }
.b-dist { stroke: var(--border); stroke-width: 1.2px; stroke-dasharray: 2 4; }
.dlabel { font-family: var(--display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; fill: var(--label); opacity: .8; pointer-events: none; }
.lmark { font-family: var(--body); font-weight: 500; fill: var(--ink); opacity: .7; pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.route { fill: none; stroke: var(--route); stroke-width: 2px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; opacity: .0; }
.route.watched { stroke: var(--mark); stroke-width: 4px; opacity: .95; }
.route.sel { stroke: var(--accent); stroke-width: 5px; opacity: 1; }
.stop { fill: var(--panel); stroke: var(--accent); vector-effect: non-scaling-stroke; stroke-width: 1.5; }
.stop.next { fill: var(--mark); stroke: var(--ink); }
.garage { fill: var(--ink); opacity: .75; }
.garage.dim { opacity: .2; }
.glabel { font-family: var(--body); font-weight: 600; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.glabel tspan.s { font-weight: 400; fill: var(--muted); }
.b-runway { fill: none; stroke: var(--road-case); stroke-width: calc(5px * var(--z)); vector-effect: non-scaling-stroke; stroke-linecap: butt; }
.wring { fill: none; stroke: var(--mark); stroke-width: 2.6; vector-effect: non-scaling-stroke; pointer-events: none; }
.bus { stroke: var(--panel); vector-effect: non-scaling-stroke; stroke-width: 1.2; cursor: pointer; }
.bus.ok { fill: var(--ok); } .bus.est { fill: var(--est); } .bus.off { fill: var(--off); } .bus.gar { fill: var(--off); }
.bus.dim { opacity: .1; pointer-events: none; }
.bus.hide { display: none; }
.ring { fill: none; stroke: var(--crit); stroke-width: 2.4; vector-effect: non-scaling-stroke; pointer-events: none; }
.ring.high { stroke: var(--est); stroke-width: 1.8; animation: none; }
.selring { fill: none; stroke: var(--ink); stroke-width: 3; vector-effect: non-scaling-stroke; pointer-events: none; }
.sellabel { font-family: var(--display); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; pointer-events: none; }
.gpsdot { fill: var(--crit); stroke: var(--panel); vector-effect: non-scaling-stroke; stroke-width: 1.2; cursor: pointer; }
.gpspath { fill: none; stroke: var(--crit); stroke-width: 2.4; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; opacity: .85; }
.gpsend { fill: var(--panel); stroke: var(--crit); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spoof { stroke: #8a3ffc; stroke-width: 2.2; vector-effect: non-scaling-stroke; fill: none; stroke-dasharray: 6 3; }
.spoofend { fill: #8a3ffc; }
.hot { fill: var(--crit); opacity: .13; pointer-events: none; }
@keyframes pulse { 0% { opacity: 1 } 100% { opacity: .25 } }
.ring { animation: pulse 1.2s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
.attr { position: absolute; right: 8px; bottom: 6px; font-size: 10.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 1px 6px; border-radius: 4px; }

/* Side panel */
.side { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side-scroll { overflow-y: auto; min-height: 0; flex: 1; }
.sec { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.sec:first-child { border-top: 0; }
.sec h3 { margin: 0; font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .01em; display: flex; justify-content: space-between; align-items: baseline; }
.sec h3 small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }
.alert { display: grid; grid-template-columns: 4px 1fr; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 10px 9px 0; width: 100%; }
.alert:hover { background: var(--panel-2); }
.alert .bar { border-radius: 0 3px 3px 0; }
.alert .t { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.alert .t time { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
.alert .m { font-size: 12px; color: var(--muted); }
.alert.compact .m { display: none; }
.alert .who { font-family: var(--mono); font-size: 12px; }
.sev-crit { background: var(--crit); } .sev-high { background: var(--est); } .sev-med { background: var(--warn); } .sev-low { background: var(--off); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.est { color: var(--est); } .pill.off { color: var(--off); } .pill.crit { color: var(--crit); } .pill.warn { color: var(--warn); }
.wl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.wlh { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel-2); border-left: 4px solid var(--mark); font-size: 12.5px; }
.wlh span { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wlh b { font-size: 14px; }
.wx { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
.wrows { display: grid; }
.wrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: var(--panel); padding: 7px 10px; font-size: 12.5px; }
.wrow:hover { background: var(--panel-2); }
.wrow.on { background: var(--accent-soft); }
.wrow .nx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .sp { color: var(--muted); font-size: 12px; }
.wrow .pill { font-size: 11px; padding: 1px 7px; }
.wmore { padding: 6px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.feed { display: grid; gap: 6px; font-size: 12.5px; }
.feed div { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
.feed time { font-family: var(--mono); color: var(--muted); font-size: 11.5px; }

/* Vehicle detail */
.vhead { padding: 14px 16px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.back { justify-self: start; border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }
.vtitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vtitle b { font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 700; }
.vtitle .plate { font-family: var(--mono); font-size: 14px; border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 7px; }
.vtitle .type { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 5px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

// zoom / pan
function zoomK() { const r = svg.getBoundingClientRect(); if (!r.width) return 1; return Math.max(st.vb[2] / r.width, st.vb[3] / r.height) * 1.15; }

function fitBounds(pts, pad = 0.18) {

}
function followTo(v) { const [x, y] = P(v.lat, v.lon), w = st.vb[2], h = st.vb[3]; setVB([x - w / 2, y - h / 2, w, h]); }
function fitRegion() {
  const Rs = st.region ? [REGIONS[st.region - 1]] : REGIONS;
  const pts = []; Rs.forEach(R => { R.anchors.forEach(a => pts.push(P(a[0], a[1]))); pts.push(P(R.garage[0], R.garage[1])); });
  fitBounds(pts, st.region ? 0.12 : 0.06);
}

  setVB([cx - (cx - x) * nw / w, cy - (cy - y) * nh / h, nw, nh]);
}
const svgPt = (e) => { const r = svg.getBoundingClientRect(); const [x, y, w, h] = st.vb; const s = Math.max(w / r.width, h / r.height); const ox = (r.width * s - w) / 2, oy = (r.height * s - h) / 2; return [x - ox + (e.clientX - r.left) * s, y - oy + (e.clientY - r.top) * s]; };

      <select id="fver" aria-label="Sürüm"><option value="">Bütün sürümler</option><option>1.4.1</option><option>1.4.0</option><option>1.3.2</option></select>
      <input id="fq" type="search" placeholder="Kapı no, plaka, IP, hat" aria-label="Tabloda ara">
      <span class="count" id="vcount"></span></div>
      <div class="tablewrap"><table id="vt"><thead><tr><th>Kapı no</th><th>Tip</th><th>Plaka</th><th>Bölge</th><th>Hat</th><th>Durum</th><th>Konum</th><th>SIM IP</th><th>BusPanel</th><th>Sorun</th></tr></thead><tbody></tbody></table></div>
      <button class="btn more" id="more" hidden>Daha fazla göster</button>`;
    [["ftype", "ftype"], ["fstat", "fstat"], ["fver", "fver"]].forEach(([id, k]) => { const s = $("#" + id, view); s.value = st[k]; s.onchange = () => { st[k] = s.value; st.rows = 80; renderTable(false); }; });
    const fq = $("#fq", view); fq.value = st.fq; fq.oninput = () => { st.fq = fq.value; st.rows = 80; renderTable(false); };
    $("#more", view).onclick = () => { st.rows += 120; renderTable(false); };
  }
  const rows = filtered();
  $("#vcount", view).textContent = fmt(rows.length) + " araç" + (st.region ? " · " + REGIONS[st.region - 1].name : "");
  $("#vt tbody", view).innerHTML = rows.slice(0, st.rows).map(v => `<tr data-k="${v.kapi}" class="${st.sel === v ? "on" : ""}"><td class="mono"><b>${v.kapi}</b></td><td>${TYPE[v.type]}</td><td class="mono">${v.plate}</td><td>${v.region}. Bölge</td><td class="mono">${v.code || "—"}</td><td>${statusPill(v)}</td><td>${v.status === "hatta" ? (v.src === "est" ? "CAN+KML" : "GPS") : v.status === "cevrimdisi" ? agoText(v.lastSeen) : "—"}</td><td class="mono">${v.ip}</td><td class="mono">${v.panel}</td><td>${v.issues.length ? `<span style="color:var(--${v.issues[0].sev === "crit" ? "crit" : "warn"})">${esc(v.issues[0].title)}</span>` : ""}</td></tr>`).join("");
  $("#more", view).hidden = rows.length <= st.rows;
  view.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => select(byKapi[+tr.dataset.k]));
}

  <div style="padding:16px;display:grid;gap:18px">${groups.map(([s, n]) => { const g = list.filter(a => a.sev === s); return g.length ? `<div style="display:grid;gap:8px"><h3 style="margin:0;font-family:var(--display);font-size:16px;font-weight:600">${n} <small style="color:var(--muted);font-weight:400">${g.length}</small></h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px">${g.map(alertHTML).join("")}</div></div>` : ""; }).join("")}</div>`;

function renderGpsBottom() {
  const box = $("#gpsbottom");
  const loss = GPS.filter(e => !st.region || e.region === st.region), sp = SPOOF.filter(e => !st.region || e.region === st.region);
  // per-vehicle spread: losses in many different places point at the antenna
  const byV = {}; GPS.forEach(e => { if (st.region && e.region !== st.region) return; (byV[e.v.kapi] = byV[e.v.kapi] || []).push(e); });
  const suspects = Object.entries(byV).filter(([, es]) => es.length >= 5).sort((a, b) => b[1].length - a[1].length);
  const cells = {}; loss.forEach(e => { const k = e.code + "@" + Math.round(e.path[0][0] * 300) + ":" + Math.round(e.path[0][1] * 300); (cells[k] = cells[k] || []).push(e); });
  const spots = Object.values(cells).filter(c => new Set(c.map(e => e.v.kapi)).size >= 3).sort((a, b) => b.length - a.length);
  const tbl = st.gpsTab === "loss"
    ? `<table><thead><tr><th>Başlangıç</th><th>Süre</th><th>Mesafe</th><th>Hat</th><th>Araç</th><th>Bölge</th><th>Nasıl ilerlendi</th></tr></thead><tbody>${loss.map((e) => `<tr data-i="${GPS.indexOf(e)}"><td class="mono">${atText(e.ago)}</td><td class="num">${e.dur >= 60 ? Math.floor(e.dur / 60) + " dk " + (e.dur % 60) + " sn" : e.dur + " sn"}</td><td class="num">${e.dist >= 1000 ? (e.dist / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(e.dist) + " m"}</td><td class="mono">${e.code}</td><td class="mono">${e.v.kapi}</td><td>${e.region}. Bölge</td><td>CAN + KML, anonslar sürdü</td></tr>`).join("")}</tbody></table>`
    : `<table><thead><tr><th>Zaman</th><th>Sapma</th><th>Süre</th><th>Hat</th><th>Araç</th><th>Gerçek yer</th><th>GPS'in gösterdiği</th><th>Sonuç</th></tr></thead><tbody>${sp.map(e => `<tr data-s="${SPOOF.indexOf(e)}"><td class="mono">${atText(e.ago)}</td><td class="num">${e.km.toFixed(1).replace(".", ",")} km</td><td class="num">${e.dur} sn</td><td class="mono">${e.code}</td><td class="mono">${e.v.kapi}</td><td class="mono">${e.at[0].toFixed(4)}, ${e.at[1].toFixed(4)}</td><td class="mono">${e.to[0].toFixed(4)}, ${e.to[1].toFixed(4)}</td><td>Reddedildi, CAN ile devam</td></tr>`).join("")}</tbody></table>`;
  box.innerHTML = `<div style="display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0">
      <div class="viewhead" style="position:static"><h2>GPS raporu</h2><div class="subtabs" role="tablist"><button role="tab" data-g="loss" aria-selected="${st.gpsTab === "loss"}">Kopmalar · ${loss.length}</button><button role="tab" data-g="spoof" aria-selected="${st.gpsTab === "spoof"}">Yanlış konum · ${sp.length}</button></div><span class="count">son 3 gün</span></div>
      <div class="tablewrap">${tbl}</div></div>
    <div class="insight">
      <h4>Anten şüphesi</h4><p>Her yerde kopan araç: sorun büyük ihtimalle anten ya da cihazda.</p>
      ${suspects.map(([k, es]) => `<button class="irow" data-k="${k}"><span><b>${k}</b> · ${new Set(es.map(e => e.code)).size} hat, ${es.length} kopma</span><span style="color:var(--crit)">bakıma</span></button>`).join("") || `<p>Bu bölgede yok.</p>`}
      <h4>Sık kopan yerler</h4><p>Birçok aracın aynı yerde koptuğu noktalar: tünel, alt geçit ya da jammer.</p>
      ${spots.slice(0, 5).map(c => `<button class="irow" data-i="${GPS.indexOf(c[0])}"><span>Hat <b>${c[0].code}</b> · ${new Set(c.map(e => e.v.kapi)).size} araç</span><span class="num">${c.length} kez</span></button>`).join("") || `<p>Bu bölgede yok.</p>`}
    </div>`;
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { st.gpsTab = b.dataset.g; renderGpsBottom(); renderLegend(); drawGps(); drawBuses(); });
  box.querySelectorAll("tr[data-i], .irow[data-i]").forEach(r => r.onclick = () => focusGps(+r.dataset.i));
  box.querySelectorAll("tr[data-s]").forEach(r => r.onclick = () => focusSpoof(+r.dataset.s));
  box.querySelectorAll(".irow[data-k]").forEach(r => r.onclick = () => { const v = byKapi[+r.dataset.k]; select(v, true); });

function focusGps(i) { const e = GPS[i]; st.sel = e.v; renderSide(); fitBounds(e.path.map(p => P(p[0], p[1])).concat([P(e.path[0][0] + .004, e.path[0][1] + .006), P(e.path[0][0] - .004, e.path[0][1] - .006)]), 0.3); }
function focusSpoof(i) { const e = SPOOF[i]; st.sel = e.v; renderSide(); fitBounds([P(e.at[0], e.at[1]), P(e.to[0], e.to[1])], 0.25); }

function renderUpdates() {
  const view = $("#view");
  const all = V.filter(inRegion), tgt = all.filter(v => v.upd !== "next");
  const cnt = u => tgt.filter(v => v.upd === u).length;
  const okN = cnt("ok"), pct = tgt.length ? Math.round(okN / tgt.length * 100) : 0;
  const order = ["ok", "wait", "dl", "queued", "err", "rb"];
  const seg = order.map(u => `<i style="width:${tgt.length ? cnt(u) / tgt.length * 100 : 0}%;background:var(--${UPD_LABEL[u][1]})${u === "wait" ? ";opacity:.55" : ""}" title="${UPD_LABEL[u][0]}: ${cnt(u)}"></i>`).join("");
  const tonight = tgt.filter(v => v.upd === "wait" || v.upd === "dl" || v.upd === "queued");
  const regRows = REGIONS.filter(R => !st.region || R.n === st.region).map(R => { const t = V.filter(v => v.region === R.n && v.upd !== "next"), ok = t.filter(v => v.upd === "ok").length; return `<tr><td>${R.name}</td><td class="num">${t.length}</td><td class="num">${ok}</td><td class="num">${t.filter(v => v.upd === "wait").length}</td><td class="num">${t.filter(v => v.upd === "dl" || v.upd === "queued").length}</td><td class="num" style="color:${t.some(v => v.upd === "err" || v.upd === "rb") ? "var(--crit)" : "inherit"}">${t.filter(v => v.upd === "err" || v.upd === "rb").length}</td><td style="width:30%"><span class="prog"><i style="width:${t.length ? ok / t.length * 100 : 0}%"></i></span></td></tr>`; }).join("");
  // health chart: crashes per 1000 vehicle-hours, last 7 days
  const days = ["5 Kas", "6 Kas", "7 Kas", "8 Kas", "9 Kas", "10 Kas", "11 Kas"], OLD = [0.62, 0.58, 0.61, 0.57, 0.60, 0.59, 0.60], NEW = [null, null, 0.55, 0.47, 0.43, 0.41, 0.40];
  const cw = 420, ch = 150, pl = 34, pr = 12, pt = 10, pb = 26, X = i => pl + i * (cw - pl - pr) / 6, Y = val => pt + (1 - val / 0.8) * (ch - pt - pb);
  const line = (arr, col) => { const pts = arr.map((val, i) => val == null ? null : [X(i), Y(val)]).filter(Boolean); return `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2.4"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="${col}"/>`).join(""); };
  const chart = `<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;max-width:100%;height:auto" role="img" aria-label="Çökme oranı karşılaştırması">${[0, 0.2, 0.4, 0.6, 0.8].map(t => `<line x1="${pl}" x2="${cw - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${String(t).replace(".", ",")}</text>`).join("")}${days.map((d, i) => `<text x="${X(i)}" y="${ch - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d}</text>`).join("")}${line(OLD, "var(--off)")}${line(NEW, "var(--accent)")}</svg>`;
  const f = st.updFilter, list = tgt.filter(v => !f || v.upd === f).sort((a, b) => order.indexOf(b.upd === "err" || b.upd === "rb" ? "ok" : "x") - 0 || a.updAgo - b.updAgo);
  const prio = u => ({ err: 0, rb: 1, queued: 2, dl: 3, wait: 4, ok: 5 }[u]);
  list.sort((a, b) => prio(a.upd) - prio(b.upd) || a.updAgo - b.updAgo);
  const note = v => v.updNote || (v.upd === "wait" ? "Araç seferde; hat kapanınca ya da gece garajda kurulacak" : v.upd === "dl" ? "Arka planda indiriliyor (%" + (20 + v.kapi % 70) + ")" : v.upd === "queued" ? "Araç bağlanınca indirme başlayacak" : v.upd === "ok" ? "Sağlıklı açılış bildirildi" : "");
  const confirm = st.updConfirm === "rb" ? `<div class="confirm"><b>Geri alma onayı</b><span>${okN} araç BusPanel 1.4.0'a dönecek. Araçlar sefer dışında ya da gece garajda kurulur; yolcu ekranı kesilmez.</span><div><button class="btn" data-a="cancel">Vazgeç</button><button class="btn danger" data-a="rbok">Geri al</button></div></div>`
    : st.updConfirm === "pause" ? `<div class="confirm"><b>Yayını duraklat</b><span>Yeni indirme ve kurulum başlamaz; kurulu ${okN} araç 1.4.1'de kalır.</span><div><button class="btn" data-a="cancel">Vazgeç</button><button class="btn primary" data-a="pauseok">Duraklat</button></div></div>` : "";
  view.innerHTML = `<div class="viewhead"><h2>Güncellemeler</h2><span class="count">${st.region ? REGIONS[st.region - 1].name + " · " : ""}kademeli yayın</span></div>
  <div class="upd">
    <div class="rel">
      <div class="relh"><div><small>Yayındaki sürüm</small><b>BusPanel 1.4.1</b><span>1.4.0'dan · 7 Kasım 2026'da başladı</span></div><div class="relact"><button class="btn" data-a="pause">Duraklat</button><button class="btn" data-a="next" disabled title="Kurulum en az %95 olmalı">Sonraki aşama<small>%${pct} kuruldu · en az %95 gerekli</small></button><button class="btn danger" data-a="rb">Geri al</button></div></div>
      ${confirm}
      <ul class="notes"><li>Çalacak anons önceliği: önbellekte olmayan anons da zamanında çalıyor</li><li>Reklam videosu uygulama hafızasındaki kopyadan oynuyor, takılma giderildi</li><li>Plaka ve sicil yalnız validatörde hat açıkken</li></ul>
      <div class="meta mono"><span>247 MB</span><span>SHA-256 3f9a…c21e</span><span>İmza: Rubuplus release · doğrulandı</span></div>
    </div>
    <div class="stages">${STAGES.map(sg => { const n = sg.run ? tgt.length : sg.n, done = sg.done ? sg.n : sg.run ? okN : 0; return `<div class="stage-c ${sg.done ? "done" : sg.run ? "run" : ""}"><b>${sg.name}</b><small>${fmt(sg.n)} araç · ${sg.done ? "tamamlandı" : sg.run ? "sürüyor" : "bekliyor"}</small><span class="prog"><i style="width:${n ? done / n * 100 : 0}%"></i></span><small>${sg.done ? "Çökme oranı önceki sürümden düşük ✓" : sg.run ? `${fmt(done)} / ${fmt(n)} kuruldu` : "Geçiş: %95 kurulum + çökme ≤ önceki"}</small></div>`; }).join("")}</div>
    <div class="grid2">
      <div class="box"><h4>Bu aşamadaki araçlar · ${fmt(tgt.length)}</h4>
        <div class="vbar" style="grid-template-columns:1fr"><span class="track" style="height:14px">${seg}</span></div>
        <div class="legend2">${order.map(u => `<button data-f="${u}" aria-pressed="${st.updFilter === u}"><i class="dot" style="background:var(--${UPD_LABEL[u][1]})${u === "wait" ? ";opacity:.55" : ""}"></i>${UPD_LABEL[u][0]} <b>${cnt(u)}</b></button>`).join("")}</div>
      </div>
      <div class="box"><h4>Bu gece kurulum planı</h4>
        <p class="m"><b>02:00–05:00</b> arası garajda, kontak açıkken kurulacak: <b>${fmt(tonight.length)} araç</b>. Seferdeki araçlara kurulum yapılmaz; hat kapanıp araç durunca ya da gece kurulur.</p>
        ${REGIONS.filter(R => !st.region || R.n === st.region).map(R => { const n = tonight.filter(v => v.region === R.n).length, mx = Math.max(1, ...REGIONS.map(Q => tonight.filter(v => v.region === Q.n).length)); return `<div class="vbar"><span>${R.name}</span><span class="track"><i style="width:${n / mx * 100}%;background:var(--accent)"></i></span><span class="num" style="text-align:right">${n}</span></div>`; }).join("")}
      </div>
      <div class="box"><h4>Yeni sürüm sağlığı</h4>
        <div style="display:flex;gap:14px;font-size:12px;color:var(--muted)"><span><i class="dot" style="background:var(--accent)"></i> 1.4.1</span><span><i class="dot" style="background:var(--off)"></i> 1.4.0</span><span>Çökme / 1000 araç-saat</span></div>
        ${chart}
        <div class="metric"><span>Anons gecikmesi (ortalama)</span><b class="num">0,8 sn <small style="color:var(--ok);font-weight:400">1.4.0: 1,1 sn</small></b></div>
        <div class="metric"><span>5 dk içinde sağlıklı açılış</span><b class="num">${okN} / ${okN + cnt("rb")}</b></div>
        <div class="metric"><span>Otomatik geri dönüş</span><b class="num" style="color:${cnt("rb") ? "var(--warn)" : "inherit"}">${cnt("rb")}</b></div>
      </div>
    </div>
    <div class="box"><h4>Bölgelere göre ilerleme</h4>
      <div class="tablewrap"><table><thead><tr><th>Bölge</th><th>Hedef</th><th>Kuruldu</th><th>Seferde bekliyor</th><th>İndiriliyor / sırada</th><th>Hata / geri</th><th>İlerleme</th></tr></thead><tbody>${regRows}</tbody></table></div>
    </div>
    <div class="box"><h4>Araçlar ${f ? "· " + UPD_LABEL[f][0] : ""} <small style="font-family:var(--body);font-weight:400;color:var(--muted)">${fmt(list.length)}</small></h4>
      <div class="tablewrap"><table><thead><tr><th>Kapı no</th><th>Bölge</th><th>Tip</th><th>Durum</th><th>Sürüm</th><th>Son adım</th><th>Not</th></tr></thead><tbody>${list.slice(0, st.updRows).map(v => `<tr data-k="${v.kapi}"><td class="mono"><b>${v.kapi}</b></td><td>${v.region}. Bölge</td><td>${TYPE[v.type]}</td><td><span class="pill ${UPD_LABEL[v.upd][1] === "accent" ? "est" : UPD_LABEL[v.upd][1]}">${UPD_LABEL[v.upd][0]}</span></td><td class="mono">${v.upd === "ok" ? "1.4.0 → 1.4.1" : v.upd === "rb" ? "1.4.1 → 1.4.0" : v.panel + " → 1.4.1"}</td><td>${agoText(v.updAgo)}</td><td style="white-space:normal;min-width:220px">${esc(note(v))}</td></tr>`).join("")}</tbody></table></div>
      ${list.length > st.updRows ? `<button class="btn more" data-a="more">Daha fazla göster</button>` : ""}
    </div>
    <div class="box"><h4>Yolcuyu rahatsız etmeme kuralları</h4>
      <ol class="rules"><li>İndirme seferde yapılabilir, kurulum yapılmaz.</li><li>Kurulum gece garajda ya da sefer dışında: hat kapalı, araç duruyor, 5 dk anons yok.</li><li>Kurulumda ekranda 3–5 sn Ankara görseli kalır, panel kaldığı duraktan devam eder.</li><li>5 dk içinde "sağlıklı" bildirimi gelmezse önceki sürüme dönülür, yayın kendiliğinden durur.</li><li>Her aşamada çökme oranı ve anons gecikmesi önceki sürümle karşılaştırılır.</li></ol>
    </div>
  </div>`;
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { st.updFilter = st.updFilter === b.dataset.f ? "" : b.dataset.f; st.updRows = 40; renderUpdates(); });
  view.querySelectorAll("tr[data-k]").forEach(tr => tr.onclick = () => select(byKapi[+tr.dataset.k]));
  view.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "more") { st.updRows += 60; return renderUpdates(); }
    if (a === "rb" || a === "pause") { st.updConfirm = a; return renderUpdates(); }
    if (a === "cancel") { st.updConfirm = ""; return renderUpdates(); }
    if (a === "rbok") { st.updConfirm = ""; renderUpdates(); return toast("Geri alma başlatıldı: araçlar sefer dışında 1.4.0'a dönecek (örnek)"); }
    if (a === "pauseok") { st.updConfirm = ""; renderUpdates(); return toast("Yayın duraklatıldı (örnek)"); }
  });
}

/* ---------- Search ---------- */
const q = $("#q"), hits = $("#hits");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase().replace(/\s/g, "");
  if (s.length < 2) { hits.hidden = true; return; }
  const res = V.filter(v => String(v.kapi).startsWith(s) || v.plate.toLowerCase().replace(/\s/g, "").includes(s) || v.ip.startsWith(s)).slice(0, 7);
  hits.innerHTML = res.map(v => `<button data-k="${v.kapi}"><b class="mono">${v.kapi}</b><span class="mono" style="color:var(--muted)">${v.plate} · ${v.ip}</span><span>${v.region}. B.</span></button>`).join("") || `<div style="padding:10px;color:var(--muted)">Eşleşen araç yok</div>`;
  hits.hidden = false;
  hits.querySelectorAll("button").forEach(b => b.onclick = () => { hits.hidden = true; q.value = ""; const v = byKapi[+b.dataset.k]; if (st.region && v.region !== st.region) { st.region = v.region; renderAll(false); } if (st.view !== "harita") setView("harita"); select(v, true); });
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const b = hits.querySelector("button"); if (b) b.click(); } if (e.key === "Escape") hits.hidden = true; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) hits.hidden = true; });

/* ---------- Live simulation ---------- */
const movers = V.filter(v => v.route && v.status === "hatta");
function tick() {
  const t = new Date();
  $("#clock").textContent = t.toTimeString().slice(0, 8);
  movers.forEach(v => {
    if (v.speed === 0) { if (rnd() < 0.15) v.speed = 15 + Math.floor(rnd() * 30); return; }
    const before = nextStopIdx(v);
    v.t += (v.speed / 3.6) * 2 * 6 / v.route.len;          // 6x faster than real time
    if (v.t >= 1) { v.t = 0; }
    [v.lat, v.lon] = posOnRoute(v.route, v.t);
    const after = nextStopIdx(v);
    if (after !== before && before >= 0) {
      const s = v.route.stops[before][0];
      feed.unshift({ v, t: t.toTimeString().slice(0, 5), html: `<b class="mono">${v.kapi}</b> · ${v.route.code} · ${esc(s)} durağına geldi` });
      if (rnd() < 0.3) v.speed = 0;
    }
    if (rnd() < 0.05) v.speed = Math.max(0, Math.min(55, v.speed + Math.floor((rnd() - .5) * 16)));
  });
  if (feed.length > 40) feed.length = 40;
  if (st.view === "harita" || st.view === "gps") drawBuses();
  if (st.follow && st.sel && st.sel.route && st.sel.status === "hatta" && st.view === "harita") followTo(st.sel);
  const tk = $("#trk"); if (tk && st.sel && st.sel.route) tk.innerHTML = trackHTML(st.sel);
  const f = $("#feed"); if (f) f.innerHTML = feedHTML();
  const ws = $("#wsec"); if (ws && !st.sel) ws.innerHTML = watchHTML();
  if (st.sel && st.sel.route && st.sel.status === "hatta") {
    const v = st.sel, a = $("#dNext"), b = $("#dSpeed"), c = $("#dCoord");
    if (a) a.textContent = v.route.stops[nextStopIdx(v)][0];
    if (b) b.textContent = v.speed + " km/sa";
    if (c) c.textContent = v.lat.toFixed(5) + ", " + v.lon.toFixed(5);
  }
}

function renderAll(fit) {
  renderRail(); renderWatch(); renderLegend(); renderSide();
  $("#alertBadge").textContent = ALERTS.filter(a => inRegion(a.v) && (a.sev === "crit" || a.sev === "high")).length;
  if (st.view === "araclar") renderTable(false);
  if (st.view === "uyarilar") renderAlertsView();
  if (st.view === "guncelleme") renderUpdates();
  if (st.view === "gps") renderGpsBottom();
  if (fit) fitRegion(); else { drawRegions(); drawBuses(); drawGps(); }
}

/* ---------- Google Maps layer (used when a Maps API key is configured) ---------- */
const ORIG = { drawBuses, drawSel, drawGps, drawRegions, drawWatch, fitBounds, setVB, followTo };
function useGoogle() {
  const g = google.maps;
  const box = $("#gmap"); box.hidden = false; svg.style.display = "none"; $(".attr").hidden = true;
  const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const LIGHT = [
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "transit", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
    { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
    { elementType: "geometry", stylers: [{ saturation: -70 }, { lightness: 8 }] },
    { featureType: "road", elementType: "geometry", stylers: [{ saturation: -100 }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#c9dfea" }] },
  ];
  const DARK = [
    { elementType: "geometry", stylers: [{ color: "#141c21" }] },
    { elementType: "labels.text.fill", stylers: [{ color: "#8a99a2" }] },
    { elementType: "labels.text.stroke", stylers: [{ color: "#141c21" }] },
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "transit", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#2a363c" }] },
    { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#10242d" }] },
  ];
  const map = new g.Map(box, { center: { lat: 39.93, lng: 32.80 }, zoom: 11, disableDefaultUI: true, gestureHandling: "greedy", clickableIcons: false, styles: LIGHT });
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const c = { ok: css("--ok"), est: css("--est"), off: css("--off"), gar: css("--off"), crit: css("--crit"), mark: css("--mark"), accent: css("--accent"), ink: css("--ink"), panel: css("--panel") };
  const LL = (lat, lon) => ({ lat, lng: lon });
  const toLL = p => { const q = UNP(p[0], p[1]); return LL(q[0], q[1]); };
  const label = text => ({ text, className: "gml", color: c.ink, fontSize: "12px", fontWeight: "600" });

  ROUTES.forEach(r => { r.gl = new g.Polyline({ map, path: r.pts.map(p => LL(p[0], p[1])), visible: false, clickable: false, strokeWeight: 4, strokeOpacity: .95, strokeColor: c.mark, zIndex: 5 }); });
  REGIONS.forEach(R => { R.gm = new g.Marker({ map, position: LL(R.garage[0], R.garage[1]), clickable: false, zIndex: 3, icon: { path: "M-6,-6 L6,-6 L6,6 L-6,6 Z", fillColor: c.ink, fillOpacity: .85, strokeWeight: 0, scale: 1, labelOrigin: new g.Point(0, -14) }, label: label(R.n + ". Bölge · " + R.place) }); });

  drawRegions = function () { REGIONS.forEach(R => R.gm.setVisible(!st.region || st.region === R.n)); };
  drawWatch = function () {};
  drawBuses = function () {
    V.forEach(v => {
      const cls = busClass(v);
      const always = v === st.sel || (v.status === "hatta" && isWatched(v)) || (st.show.iss && v.issues.length > 0) || (st.ltab === "garage" && st.region === v.region && (v.status === "garajda" || v.status === "bakim"));
      const show = st.view === "harita" && (st.show[cls] || always) && !(st.region && v.region !== st.region);
      if (!show) { if (v.gm) v.gm.setVisible(false); return; }
      const sv = sevOf(v);
      const ring = v === st.sel ? c.ink : sv === "crit" ? c.crit : sv === "high" ? c.est : (v.status === "hatta" && isWatched(v)) ? c.mark : "";
      if (!v.gm) { v.gm = new g.Marker({ map, title: String(v.kapi) }); v.gm.addListener("click", () => select(v)); }
      v.gm.setPosition(LL(v.lat, v.lon));
      const key = cls + ring + v.type + (v === st.sel);
      if (v.gmKey !== key) {
        v.gmKey = key;
        v.gm.setIcon({ path: g.SymbolPath.CIRCLE, scale: v.type === "K" ? 6.5 : 5.5, fillColor: c[cls], fillOpacity: 1, strokeColor: ring || "#ffffff", strokeWeight: ring ? 3.5 : 1.5, labelOrigin: new g.Point(0, -2.6) });
        v.gm.setLabel(v === st.sel ? label(String(v.kapi)) : null);
        v.gm.setZIndex(v === st.sel ? 40 : ring ? 20 : 10);
      }
      v.gm.setVisible(true);
    });
    drawSel();
  };
  let stopMarks = [], stopKey = "";
  drawSel = function () {
    ROUTES.forEach(r => { const s = st.sel && st.sel.route === r, w = st.watched.has(r.code) && st.view === "harita"; r.gl.setOptions({ visible: s || w, strokeColor: s ? c.accent : c.mark, strokeWeight: s ? 5 : 4, zIndex: s ? 6 : 5 }); });
    const v = st.sel, nx = v && v.route ? nextStopIdx(v) : -1, key = v && v.route ? v.route.code + ":" + nx : "";
    if (key === stopKey) return;
    stopKey = key; stopMarks.forEach(m => m.setMap(null)); stopMarks = [];
    if (!key) return;
    v.route.stops.forEach((s, i) => stopMarks.push(new g.Marker({ map, position: LL(s[1], s[2]), clickable: false, zIndex: i === nx ? 9 : 7,
      icon: { path: g.SymbolPath.CIRCLE, scale: i === nx ? 6 : 3.2, fillColor: i === nx ? c.mark : "#ffffff", fillOpacity: 1, strokeColor: i === nx ? c.ink : c.accent, strokeWeight: 1.5, labelOrigin: new g.Point(0, -3.4) },
      label: i === nx ? label("Sıradaki: " + s[0]) : null })));
  };
  let gpsObjs = [];
  drawGps = function () {
    gpsObjs.forEach(o => o.setMap(null)); gpsObjs = [];
    if (st.view !== "gps") return;
    const dot = (p, fill, stroke, scale, z) => new g.Marker({ map, position: LL(p[0], p[1]), zIndex: z, icon: { path: g.SymbolPath.CIRCLE, scale, fillColor: fill, fillOpacity: 1, strokeColor: stroke, strokeWeight: 1.5 } });
    if (st.gpsTab === "loss") {
      const cells = {};
      GPS.filter(e => !st.region || e.region === st.region).forEach(e => { const k = Math.round(e.path[0][0] / 0.006) + ":" + Math.round(e.path[0][1] / 0.008); (cells[k] = cells[k] || []).push(e.path[0]); });
      Object.values(cells).filter(cl => cl.length >= 4).forEach(cl => gpsObjs.push(new g.Circle({ map, center: LL(cl.reduce((s, p) => s + p[0], 0) / cl.length, cl.reduce((s, p) => s + p[1], 0) / cl.length), radius: 300 + cl.length * 60, strokeWeight: 0, fillColor: c.crit, fillOpacity: .14, clickable: false })));
      GPS.forEach((e, i) => {
        if (st.region && e.region !== st.region) return;
        gpsObjs.push(new g.Polyline({ map, path: e.path.map(p => LL(p[0], p[1])), strokeOpacity: 0, clickable: false, zIndex: 5, icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeColor: c.crit, strokeWeight: 3, scale: 2 }, offset: "0", repeat: "10px" }] }));
        gpsObjs.push(dot(e.path[e.path.length - 1], "#ffffff", c.crit, 3.5, 6));
        const m = dot(e.path[0], c.crit, "#ffffff", 6, 8); m.addListener("click", () => focusGps(i)); gpsObjs.push(m);
      });
    } else {
      SPOOF.forEach((e, i) => {
        if (st.region && e.region !== st.region) return;
        gpsObjs.push(new g.Polyline({ map, path: [LL(e.at[0], e.at[1]), LL(e.to[0], e.to[1])], strokeOpacity: 0, clickable: false, zIndex: 5,
          icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: 1, strokeColor: "#8a3ffc", strokeWeight: 3, scale: 2 }, offset: "0", repeat: "12px" }, { icon: { path: g.SymbolPath.FORWARD_CLOSED_ARROW, fillColor: "#8a3ffc", fillOpacity: 1, strokeWeight: 0, scale: 4 }, offset: "100%" }] }));
        const m = dot(e.at, c.crit, "#ffffff", 6, 8); m.addListener("click", () => focusSpoof(i)); gpsObjs.push(m);
      });
    }
  };
  fitBounds = function (pts) { const b = new g.LatLngBounds(); pts.forEach(p => b.extend(toLL(p))); map.fitBounds(b, 70); };
  setVB = function (vb) { map.panTo(toLL([vb[0] + vb[2] / 2, vb[1] + vb[3] / 2])); map.setZoom(Math.max(map.getZoom(), 15)); };
  followTo = function (v) { map.panTo(LL(v.lat, v.lon)); };
  $("#zin").onclick = () => map.setZoom(map.getZoom() + 1);
  $("#zout").onclick = () => map.setZoom(map.getZoom() - 1);
  // Google hata verirse (faturalandırma, API kapalı, adres kilidi) karartılmış harita yerine OpenStreetMap
  let fellBack = false;
  const toOSM = msg => {
    if (fellBack) return; fellBack = true; mo.disconnect();
    drawBuses = ORIG.drawBuses; followTo = ORIG.followTo; drawSel = ORIG.drawSel; drawGps = ORIG.drawGps; drawRegions = ORIG.drawRegions; drawWatch = ORIG.drawWatch; fitBounds = ORIG.fitBounds; setVB = ORIG.setVB;
    box.hidden = true; svg.style.display = ""; $(".attr").hidden = false;
    $("#zin").onclick = () => zoomAt(1 / 1.5, st.vb[0] + st.vb[2] / 2, st.vb[1] + st.vb[3] / 2);
    $("#zout").onclick = () => zoomAt(1.5, st.vb[0] + st.vb[2] / 2, st.vb[1] + st.vb[3] / 2);
    fitRegion(); toast(msg);
  };
  window.gm_authFailure = () => toOSM("Google Maps anahtarı kabul edilmedi; OpenStreetMap haritası kullanılıyor.");
  const broken = () => box.querySelector(".gm-err-container, .dismissButton") || /development purposes only/i.test(box.textContent || "");
  const mo = new MutationObserver(() => { if (broken()) toOSM("Google Maps şu an kullanılamıyor (faturalandırma ya da API ayarı); OpenStreetMap haritası kullanılıyor."); });
  mo.observe(box, { childList: true, subtree: true, characterData: true });
  drawRegions(); drawBuses(); drawGps(); fitRegion();
}
window.__useGoogle = () => { try { useGoogle(); } catch (e) { console.error(e); toast("Google Maps açılamadı; OpenStreetMap haritası kullanılıyor."); } };
if (window.MAPS_KEY) {
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(window.MAPS_KEY) + "&callback=__useGoogle&language=tr&region=TR&v=weekly";
  s.async = true; s.onerror = () => toast("Google Maps yüklenemedi; OpenStreetMap haritası kullanılıyor.");
  document.head.appendChild(s);
}

// seed the feed with recent arrivals so the panel opens populated
for (let i = 0; i < 10; i++) { const v = pick(movers); const s = v.route.stops[Math.max(0, nextStopIdx(v) - 1)][0]; const d = new Date(now.getTime() - i * 47000); feed.push({ v, t: d.toTimeString().slice(0, 5), html: `<b class="mono">${v.kapi}</b> · ${v.route.code} · ${esc(s)} durağına geldi` }); }

const start = (location.hash || "").slice(1);
renderAll(false);
requestAnimationFrame(() => fitRegion());
setView(["harita", "araclar", "gps", "uyarilar", "guncelleme"].includes(start) ? start : "harita");
tick();
setInterval(tick, 2000);
})();
</script>
